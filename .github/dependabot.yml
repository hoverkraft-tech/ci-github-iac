version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: build
      include: scope
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: docker
    commit-message:
      prefix: build
      include: scope
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      docker-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    commit-message:
      prefix: build
      include: scope
    directories:
      - /actions/ansible/test
      - /actions/ansible/test-molecule
      - /actions/vm/create
      - /actions/vm/test
      - /actions/vm/destroy
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      github-script-test-helpers:
        patterns: ["@actions/*"]
  - package-ecosystem: pip
    commit-message:
      prefix: build
      include: scope
    directories:
      - /tests/fixture/ansible
      - /actions/ansible/test-molecule
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
