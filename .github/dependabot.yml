version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      docker-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /actions/ansible/test
      - /actions/ansible/test-molecule
      - /actions/vm/create
      - /actions/vm/test
      - /actions/vm/destroy
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      github-script-test-helpers:
        patterns: ["@actions/*"]
  - package-ecosystem: pip
    directories:
      - /tests/fixture/ansible
      - /actions/ansible/test-molecule
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
