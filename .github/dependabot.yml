version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /
      - /tests/fixture/ansible
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      docker-dependencies:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tests/fixture/ansible
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
