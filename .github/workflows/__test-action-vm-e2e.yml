---
name: Internal - Test disposable VM action
on:
  workflow_call:
permissions: {}
jobs:
  success:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate guest assertions
        uses: $/actions/vm-e2e
        with:
          test-script: tests/fixture/assert.sh
  failure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure the consumer has no Makefile
        run: rm Makefile
      - name: Execute deliberately failing guest assertions
        id: scenario
        # This test expects failure; the following step checks the actual outcome.
        continue-on-error: true
        uses: $/actions/vm-e2e
        with:
          test-script: tests/fixture/fail.sh
          artifact-path: .reports/failure
          test-timeout-minutes: 1
      - name: Require failure evidence and verified teardown
        if: ${{ always() }}
        env:
          SCENARIO_OUTCOME: ${{ steps.scenario.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          assert os.environ['SCENARIO_OUTCOME'] == 'failure'
          assert not Path('Makefile').exists()
          report = Path('.reports/failure/e2e.junit.xml').read_text()
          assert ET.fromstring(report).get('failures') == '1'
          assert 'synthetic-private-output' not in report
          status = json.loads(Path('.reports/failure/vm.json').read_text())
          assert status == {'status': 'absent'}
          PY
