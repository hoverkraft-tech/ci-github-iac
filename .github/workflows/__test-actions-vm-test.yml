---
name: Internal - Test vm/test
on:
  workflow_call:
permissions: {}
jobs:
  unit-tests:
    # Standard runner and checkout setup; each action owns its test command below.
    # jscpd:ignore-start
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Arrange - Checkout action sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # jscpd:ignore-end
      - name: Act - Run vm/test unit tests
        uses: hoverkraft-tech/ci-github-nodejs/actions/test@02a04ad25ceaacdf3b7200e45fb7fec07fadf4fa # 2.1.0
        with:
          working-directory: actions/vm/test
          command: test:ci
          coverage: ""
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        backend: [lima, qemu]
    steps:
      - name: Arrange - Checkout fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Arrange - Prepare VM inputs
        id: fixture
        uses: $/tests/fixture/prepare-vm
        with:
          backend: ${{ matrix.backend }}
      # Shared creation is fixture setup; this workflow exercises testing.
      # jscpd:ignore-start
      - name: Arrange - Create VM
        id: vm
        uses: $/actions/vm/create
        with:
          backend: ${{ matrix.backend }}
          vm-config: ${{ steps.fixture.outputs.vm-config }}
          startup-timeout-minutes: 5
      # jscpd:ignore-end
      - name: Arrange - Change groups after SSH connection setup
        env:
          VM_SSH_CONFIG: ${{ steps.vm.outputs.ssh-config }}
          VM_NAME: ${{ steps.vm.outputs.name }}
        run: |
          ssh -F "$VM_SSH_CONFIG" "$VM_NAME" '
            set -eu
            sudo -n groupadd iac-goss
            sudo -n usermod -aG iac-goss "$(id -un)"
            ! id -nG | grep -qw iac-goss
          '
      - name: Arrange - Capture existing comments when publication is disabled
        if: ${{ matrix.backend == 'lima' }}
        id: comment-before
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_NAME: Goss - ${{ matrix.backend }} - valid
        with:
          script: |
            const { PublishedReports } = require('./tests/helpers/published-reports.cjs');
            const published = new PublishedReports(github, context);
            core.setOutput('comments', JSON.stringify(await published.readComments(process.env.REPORT_NAME)));
      - name: Act - Validate valid suite
        if: ${{ !cancelled() && steps.vm.outcome == 'success' }}
        id: valid
        continue-on-error: true
        uses: $/actions/vm/test
        with:
          vm: ${{ steps.vm.outputs.vm }}
          comment: ${{ matrix.backend != 'lima' }}
          goss-file: tests/fixture/goss/valid.yaml
          goss-vars: tests/fixture/goss/vars.json
          test-timeout-minutes: 1
          report-name: Goss - ${{ matrix.backend }} - valid
      - name: Assert - Check valid results and retained reports
        if: ${{ !cancelled() && steps.vm.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTCOME: ${{ steps.valid.outcome }}
          REPORT_NAME: Goss - ${{ matrix.backend }} - valid
          EXPECT_COMMENT: ${{ matrix.backend != 'lima' }}
          COMMENTS_BEFORE: ${{ steps.comment-before.outputs.comments }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const { PublishedReports } = require('./tests/helpers/published-reports.cjs');
            const published = new PublishedReports(github, context);
            assert.equal(process.env.OUTCOME, 'success');
            const reports = await published.read('vm-test-', 1);
            assert.ok(reports.some(report => report.text.includes('goss-execution')));
            if (process.env.EXPECT_COMMENT === 'true') {
              await published.comment(process.env.REPORT_NAME);
            } else {
              assert.deepEqual(
                await published.readComments(process.env.REPORT_NAME),
                JSON.parse(process.env.COMMENTS_BEFORE),
                'Disabled publication must leave existing comments unchanged',
              );
            }
      - name: Act - Validate invalid suite
        if: ${{ !cancelled() && steps.vm.outcome == 'success' }}
        id: invalid
        continue-on-error: true
        uses: $/actions/vm/test
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: tests/fixture/goss/invalid.yaml
          goss-vars: tests/fixture/goss/vars.json
          test-timeout-minutes: 1
          report-name: Goss - ${{ matrix.backend }} - invalid
      - name: Act - Validate empty suite
        if: ${{ !cancelled() && steps.vm.outcome == 'success' }}
        id: empty
        continue-on-error: true
        uses: $/actions/vm/test
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: tests/fixture/goss/empty.yaml
          goss-vars: tests/fixture/goss/vars.json
          test-timeout-minutes: 1
          report-name: Goss - ${{ matrix.backend }} - empty
      - name: Act - Validate timeout suite
        if: ${{ !cancelled() && steps.vm.outcome == 'success' }}
        id: timeout
        continue-on-error: true
        uses: $/actions/vm/test
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: tests/fixture/goss/timeout.yaml
          goss-vars: tests/fixture/goss/vars.json
          test-timeout-minutes: 1
          report-name: Goss - ${{ matrix.backend }} - timeout
      - name: Assert - Check failed suites, independent artifacts and comments
        if: ${{ !cancelled() && steps.vm.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INVALID: ${{ steps.invalid.outcome }}
          EMPTY: ${{ steps.empty.outcome }}
          TIMEOUT: ${{ steps.timeout.outcome }}
          BACKEND: ${{ matrix.backend }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const { PublishedReports } = require('./tests/helpers/published-reports.cjs');
            for (const outcome of [process.env.INVALID, process.env.EMPTY, process.env.TIMEOUT])
              assert.equal(outcome, 'failure');
            const published = new PublishedReports(github, context);
            const reports = await published.read('vm-test-', 4);
            assert.equal(reports.filter(report => report.text.includes('failures="1"')).length, 3);
            assert.ok(reports.some(report => report.text.includes('iac-missing-synthetic-file')));
            for (const name of ['invalid', 'empty', 'timeout'])
              await published.comment(`Goss - ${process.env.BACKEND} - ${name}`);
      - name: Cleanup - Destroy VM
        if: ${{ always() && steps.vm.outputs.vm != '' }}
        uses: $/actions/vm/destroy
        with:
          vm: ${{ steps.vm.outputs.vm }}
      - name: Cleanup - Remove private fixture inputs
        if: ${{ always() }}
        run: rm -rf .cache/qemu-fixture
