---
name: Internal - Main - Continuous Integration

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Entry points repeat caller permissions; implementation stays in __shared-ci.yml.
# jscpd:ignore-start
jobs:
  ci:
    name: Continuous Integration
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  # jscpd:ignore-end

  release:
    name: Update action documentation
    needs: ci
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    uses: hoverkraft-tech/ci-github-publish/.github/workflows/release-actions.yml@b942fb00f3115ca70f98f45f2289cc9838eb9312 # 3.0.0
    permissions:
      contents: read
    with:
      merge-method: squash
      update-all: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch' }}
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
