---
name: Internal - Main - Continuous Integration

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

  schedule:
    - cron: "25 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Entry points repeat caller permissions; implementation stays in __shared-ci.yml.
# jscpd:ignore-start
jobs:
  ci:
    name: Continuous Integration
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  # jscpd:ignore-end

  release:
    name: Update action documentation
    needs: ci
    if: github.event_name != 'schedule' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch)
    uses: hoverkraft-tech/ci-github-publish/.github/workflows/release-actions.yml@80fa7011b27f49f2e04a19f932d36047d17a28f2 # 3.1.0
    permissions:
      contents: read
    with:
      merge-method: squash
      update-all: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch' }}
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  sync-docs:
    needs: release
    if: github.event_name != 'schedule' && github.ref_name == github.event.repository.default_branch && needs.release.outputs.artifact-id
    uses: hoverkraft-tech/public-docs/.github/workflows/sync-docs-dispatcher.yml@f3c9291760d927e6214e8d5f0a376af2d537c369 # 0.4.0
    permissions:
      contents: read
    with:
      artifact-id: ${{ needs.release.outputs.artifact-id }}
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
