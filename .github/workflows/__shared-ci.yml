---
name: Internal - Common Continuous Integration tasks

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@f0baf63a8aa2bcfe9847aee00d1fdfa5e32a749a # 2.0.0
    with:
      linter-env: |
        FILTER_REGEX_EXCLUDE=/(\.cache|\.reports)/
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  test-action-vm-create:
    permissions:
      contents: read
    uses: $/.github/workflows/__test-actions-vm-create.yml
  test-action-vm-test:
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: $/.github/workflows/__test-actions-vm-test.yml
  test-action-vm-destroy:
    permissions:
      contents: read
    uses: $/.github/workflows/__test-actions-vm-destroy.yml
  test-action-ansible-test:
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: $/.github/workflows/__test-actions-ansible-test.yml
  test-action-ansible-test-molecule:
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: $/.github/workflows/__test-actions-ansible-test-molecule.yml
