# Boot a disposable Lima VM through the consumer's Make lifecycle. Assertions,
# diagnostic collection and teardown remain consumer-owned. Only synthetic,
# explicitly sanitized artifacts may be published from this public workflow.
name: VM end-to-end validation
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the consumer Makefile.
        type: string
        default: .
      artifact-path:
        description: Sanitized report directory relative to the checkout; no VM disks or raw logs.
        type: string
        default: .reports
      test-timeout-minutes:
        description: Assertion time limit; cleanup has a separate time allowance.
        type: number
        default: 10
permissions:
  contents: read
jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Lima and QEMU
        uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
        with:
          # renovate: datasource=github-releases depName=lima-vm/lima
          version: v2.2.1
      - name: Create disposable VM
        id: up
        timeout-minutes: 20
        run: make e2e-up
      - name: Assert VM behavior
        timeout-minutes: ${{ inputs.test-timeout-minutes }}
        run: make e2e-test
      - name: Collect sanitized diagnostics
        if: ${{ always() && steps.up.outcome != 'skipped' }}
        timeout-minutes: 3
        run: make e2e-collect
      - name: Destroy disposable VM
        if: ${{ always() && steps.up.outcome != 'skipped' }}
        timeout-minutes: 10
        run: make e2e-down
      - name: Require passing assertions
        env:
          REPORT_DIRECTORY: ${{ github.workspace }}/${{ inputs.artifact-path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path(os.environ['REPORT_DIRECTORY']).glob('*.junit.xml'))
          if not files:
              raise SystemExit('Missing mandatory JUnit assertions')
          count = 0
          for report in files:
              root = ET.parse(report).getroot()
              cases = list(root.iter('testcase'))
              if any(list(case) for case in cases if case.find('failure') is not None or case.find('error') is not None):
                  raise SystemExit('JUnit contains failed assertions')
              count += sum(case.find('skipped') is None for case in cases)
          if count == 0:
              raise SystemExit('No mandatory assertions executed')
          PY
      - name: Upload sanitized reports
        if: ${{ always() && steps.up.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-e2e-${{ github.job }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7
