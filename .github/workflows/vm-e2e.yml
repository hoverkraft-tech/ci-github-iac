# Execute a consumer Bash script in a disposable VM using the shared action at
# this workflow's revision. Consumers provide assertions and optional Lima YAML;
# VM installation, startup, sanitized reports and cleanup belong to the action.
---
name: VM end-to-end validation
on:
  workflow_call:
    inputs:
      test-script:
        description: Bash script in the checkout to execute inside the guest.
        type: string
        required: true
      vm-config:
        description: Optional Lima YAML file in the checkout; defaults to the bundled Ubuntu template.
        type: string
        default: ""
      artifact-path:
        description: Relative directory for generated sanitized reports.
        type: string
        default: .reports
      test-timeout-minutes:
        description: Assertion time limit from 1 to 40 minutes; cleanup has a separate allowance.
        type: number
        default: 10
permissions: {}

jobs:
  vm:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate in disposable VM
        uses: $/actions/vm-e2e
        with:
          test-script: ${{ inputs.test-script }}
          vm-config: ${{ inputs.vm-config }}
          artifact-path: ${{ inputs.artifact-path }}
          test-timeout-minutes: ${{ inputs.test-timeout-minutes }}
