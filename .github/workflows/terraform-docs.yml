# Regenerate module references after successful CI on a trusted default-branch push.
# The GitHub App needs contents and pull request write permissions. The shared
# documentation PR action commits only module readme files and requests a squash
# merge. Callers retain control of when this write workflow runs.
---
name: Terraform - Update documentation
on:
  workflow_call:
    inputs:
      working-directory:
        description: Checkout-relative root containing Terraform modules.
        type: string
        default: .
      github-app-client-id:
        description: GitHub App client ID for documentation updates.
        type: string
        required: true
    secrets:
      github-app-key:
        description: GitHub App private key for documentation updates.
        required: true
permissions: {}
jobs:
  docs:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/actions/terraform/generate-docs
        with:
          working-directory: ${{ inputs.working-directory }}
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-key }}
          permission-contents: write
          permission-pull-requests: write
      - uses: hoverkraft-tech/ci-github-common/actions/create-and-merge-pull-request@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
        with:
          github-token: ${{ steps.token.outputs.token }}
          add-paths: ${{ inputs.working-directory }}/**/README.md
          branch: docs/terraform-modules
          title: "docs: update Terraform module documentation"
          body: Regenerate Terraform module references from their configuration.
          commit-message: "docs: update Terraform module documentation"
          merge-method: squash
