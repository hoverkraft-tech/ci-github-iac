---
name: Internal - Test Ansible action
on:
  workflow_call:
permissions: {}
jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        mode: [syntax, sanity]
        result: [success, failure]
    steps:
      - name: Checkout fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare selected scenario without a consumer Makefile
        env:
          MODE: ${{ matrix.mode }}
          RESULT: ${{ matrix.result }}
        run: |
          rm Makefile
          cp tests/fixture/ansible/valid.yml tests/fixture/ansible/selected.yml
          if [ "$RESULT" = failure ]; then
            if [ "$MODE" = syntax ]; then
              printf '%s\n' '---' '- hosts: all' '  tasks:' '    - unknown_fixture_module: {}' > tests/fixture/ansible/selected.yml
            else
              printf '%s\n' '---' 'invalid: [' > tests/fixture/ansible/ansible_collections/example/smoke/roles/smoke/tasks/main.yml
            fi
          fi
      - name: Test Ansible with upstream actions
        id: test
        continue-on-error: true
        uses: $/actions/ansible/test
        with:
          ansible-requirements: tests/fixture/ansible/requirements.txt
          playbooks: ${{ matrix.mode == 'syntax' && 'tests/fixture/ansible/selected.yml' || '' }}
          collection: ${{ matrix.mode == 'sanity' && 'tests/fixture/ansible/ansible_collections/example/smoke' || '' }}
          report-name: Ansible tests - ${{ matrix.mode }} - ${{ matrix.result }}
      - name: Verify check outcomes and native reports
        if: ${{ always() }}
        env:
          MODE: ${{ matrix.mode }}
          EXPECTED: ${{ matrix.result }}
          OUTCOME: ${{ steps.test.outcome }}
          REPORTS: ${{ steps.test.outputs.report-files }}
          PARSED: ${{ steps.test.outputs.parsed-files }}
          ARTIFACT: ${{ steps.test.outputs.artifact-id }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            assert.equal(process.env.OUTCOME, process.env.EXPECTED);
            const files = process.env.REPORTS.split('\n').filter(Boolean);
            assert.ok(files.length > 0);
            assert.deepEqual(JSON.parse(process.env.PARSED).sort(), files.sort());
            assert.ok(process.env.ARTIFACT);
            if (process.env.MODE === 'syntax') {
              assert.equal(files.length, 1);
              const sarif = JSON.parse(fs.readFileSync(files[0], 'utf8'));
              const failures = sarif.runs.flatMap(run => run.results).filter(result => result.level === 'error');
              assert.equal(failures.length > 0, process.env.EXPECTED === 'failure');
            } else {
              assert.ok(files.every(file => file.endsWith('.xml')));
              const reports = files.map(file => fs.readFileSync(file, 'utf8')).join('\n');
              assert.equal(/<failure\b/.test(reports), process.env.EXPECTED === 'failure');
            }
