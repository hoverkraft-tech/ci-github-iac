---
name: Internal - Test vm/create
on:
  workflow_call:
permissions: {}
jobs:
  unit-tests:
    # Standard runner and checkout setup; each action owns its test command below.
    # jscpd:ignore-start
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Arrange - Checkout action sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # jscpd:ignore-end
      - name: Act - Run vm/create unit tests
        uses: hoverkraft-tech/ci-github-nodejs/actions/test@97f64bc080b78daca8fb3ece49de448aaac83429 # 1.1.0
        with:
          working-directory: actions/vm/create
          command: test:ci
          coverage: ""
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        backend: [lima, qemu]
    steps:
      - name: Arrange - Checkout creation fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Arrange - Prepare startup configurations
        id: fixture
        uses: $/tests/fixture/prepare-vm
        with:
          backend: ${{ matrix.backend }}
      - name: Act - Reject empty VM configuration
        id: empty-config
        continue-on-error: true
        uses: $/actions/vm/create
        with:
          backend: ${{ matrix.backend }}
          vm-config: ""
      - name: Act - Reject invalid startup timeout
        id: invalid-timeout
        continue-on-error: true
        uses: $/actions/vm/create
        with:
          backend: ${{ matrix.backend }}
          vm-config: ${{ steps.fixture.outputs.vm-config }}
          startup-timeout-minutes: 41
      - name: Assert - Check invalid inputs publish no runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EMPTY_CONFIG: ${{ steps.empty-config.outcome }}
          EMPTY_CONFIG_VM: ${{ steps.empty-config.outputs.vm }}
          INVALID_TIMEOUT: ${{ steps.invalid-timeout.outcome }}
          INVALID_TIMEOUT_VM: ${{ steps.invalid-timeout.outputs.vm }}
        with:
          script: |
            const assert = require('node:assert/strict');
            assert.equal(process.env.EMPTY_CONFIG, 'failure');
            assert.equal(process.env.INVALID_TIMEOUT, 'failure');
            assert.equal(process.env.EMPTY_CONFIG_VM, '');
            assert.equal(process.env.INVALID_TIMEOUT_VM, '');
      - name: Act - Start the configured VM
        id: create
        uses: $/actions/vm/create
        with:
          backend: ${{ matrix.backend }}
          vm-config: ${{ steps.fixture.outputs.vm-config }}
          startup-timeout-minutes: 5
      - name: Assert - Check usable creation outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VM_DIRECTORY: ${{ steps.create.outputs.vm }}
          VM_NAME: ${{ steps.create.outputs.name }}
          VM_SSH_CONFIG: ${{ steps.create.outputs.ssh-config }}
          VM_BACKEND: ${{ matrix.backend }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const path = require('node:path');
            const env = process.env;
            assert.ok(env.VM_NAME);
            assert.equal(path.dirname(env.VM_DIRECTORY), env.VM_BACKEND === 'qemu' ? '/var/tmp' : '/tmp');
            assert.ok(Buffer.byteLength(path.join(env.VM_DIRECTORY, env.VM_NAME, 'ssh.sock.1234567890123456')) < 108);
            assert.equal(fs.statSync(env.VM_DIRECTORY).mode & 0o777, 0o700);
            assert.equal(fs.statSync(env.VM_SSH_CONFIG).mode & 0o777, 0o600);
            assert.equal(fs.existsSync('Makefile'), false);
            const system = await exec.getExecOutput('timeout', ['--kill-after=5s', '30s', 'ssh', '-F', env.VM_SSH_CONFIG, env.VM_NAME, 'uname', '-s']);
            assert.equal(system.stdout.trim(), 'Linux');
      - name: Cleanup - Tear down the successful startup fixture
        if: ${{ always() && steps.create.outputs.vm != '' }}
        uses: $/actions/vm/destroy
        with:
          vm: ${{ steps.create.outputs.vm }}
      - name: Act - Exercise startup rollback
        id: invalid
        continue-on-error: true
        uses: $/actions/vm/create
        with:
          backend: ${{ matrix.backend }}
          vm-config: ${{ steps.fixture.outputs.invalid-config }}
          startup-timeout-minutes: 1
      - name: Assert - Check rollback before fallback cleanup
        if: ${{ always() && steps.fixture.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STARTUP_OUTCOME: ${{ steps.invalid.outcome }}
          RECOVERY_DIRECTORY: ${{ steps.invalid.outputs.vm }}
          FIRST_DIRECTORY: ${{ steps.create.outputs.vm }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            assert.equal(process.env.STARTUP_OUTCOME, 'failure');
            assert.ok(process.env.RECOVERY_DIRECTORY);
            assert.notEqual(process.env.RECOVERY_DIRECTORY, process.env.FIRST_DIRECTORY);
            assert.equal(fs.existsSync(process.env.RECOVERY_DIRECTORY), false);
      - name: Cleanup - Clean up any failed-startup resources
        if: ${{ always() && steps.invalid.outputs.vm != '' }}
        uses: $/actions/vm/destroy
        with:
          vm: ${{ steps.invalid.outputs.vm }}
      - name: Cleanup - Remove any runtime from empty configuration
        if: ${{ always() && steps.empty-config.outputs.vm != '' }}
        uses: $/actions/vm/destroy
        with:
          vm: ${{ steps.empty-config.outputs.vm }}
      - name: Cleanup - Remove any runtime from invalid timeout
        if: ${{ always() && steps.invalid-timeout.outputs.vm != '' }}
        uses: $/actions/vm/destroy
        with:
          vm: ${{ steps.invalid-timeout.outputs.vm }}
      - name: Cleanup - Remove creation fixture inputs
        if: ${{ always() }}
        run: rm -rf .cache/qemu-fixture
