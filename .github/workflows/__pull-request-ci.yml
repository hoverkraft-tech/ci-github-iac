---
name: Internal - Pull request - Continuous Integration

on:
  merge_group:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Entry points repeat caller permissions; implementation stays in __shared-ci.yml.
# jscpd:ignore-start
jobs:
  ci:
    name: Continuous Integration
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
# jscpd:ignore-end
