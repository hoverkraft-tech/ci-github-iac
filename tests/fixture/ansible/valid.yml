---
- name: Exercise a synthetic Ansible test assertion
  hosts: fixture
  gather_facts: false
  roles:
    - example.smoke.smoke
  tasks:
    - name: Assert the selected fixture succeeds
      ansible.builtin.assert:
        that:
          - fixture_result == 'success'
          - lookup('ansible.builtin.pipe', (ansible_playbook_python | quote) ~ ' --version') | trim == 'Python ' ~ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'GITHUB_WORKSPACE') ~ '/tests/fixture/ansible/.python-version')
      vars:
        fixture_result: "{{ lookup('ansible.builtin.env', 'FIXTURE_RESULT') }}"
