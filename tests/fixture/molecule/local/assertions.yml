---
- name: Verify the local test resource
  hosts: fixture
  gather_facts: false
  tasks:
    - name: Simulate a stalled verification
      ansible.builtin.command: sleep 120
      changed_when: false
      when: lookup('ansible.builtin.env', 'MOLECULE_TEST_RESULT') == 'timeout'
    - name: Read the generated configuration
      ansible.builtin.slurp:
        src: "{{ fixture_directory }}/configuration"
      register: configuration
    - name: Assert configuration and selected outcome
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.pipe', (ansible_playbook_python | quote) ~ ' --version') | trim == 'Python ' ~ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'GITHUB_WORKSPACE') ~ '/tests/fixture/ansible/.python-version')
          - (configuration.content | b64decode) == "scenario-owned configuration\n"
          - lookup('ansible.builtin.env', 'MOLECULE_TEST_RESULT') != 'failure'
