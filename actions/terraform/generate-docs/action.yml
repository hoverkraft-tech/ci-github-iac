# Generate Terraform module reference sections using the upstream terraform-docs action.
# Existing README content outside BEGIN_TF_DOCS/END_TF_DOCS markers is preserved.
# Modules are discovered recursively below working-directory. Lockfile data is
# excluded so documentation does not depend on prior provider initialization.
# This action only edits the checkout; callers own committing or publishing changes.
---
name: Terraform - Generate documentation
description: Generate and inject Terraform module references into README files.
author: Hoverkraft
branding:
  icon: book-open
  color: purple
inputs:
  working-directory:
    description: Checkout-relative root containing Terraform modules to document.
    default: .
runs:
  using: composite
  steps:
    - name: Resolve documentation root
      id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Generate module references
      uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
      with:
        find-dir: ${{ steps.directory.outputs.workspace-relative-path }}
        output-file: README.md
        output-method: inject
        args: --lockfile=false
        git-push: "false"
