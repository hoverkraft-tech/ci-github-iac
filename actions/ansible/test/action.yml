# Run Ansible tests with maintained upstream actions and native JUnit reports.
#
# ### Disposable VM deployment scenarios
#
# Supply `molecule-scenario` and the `vm` output of vm/create from the same job.
# The scenario directory contains molecule.yml, converge.yml and verify.yml.
# Use Ansible-native configuration; converge imports the real deployment playbook,
# and verify contains explicit assertions. The action installs pinned Molecule,
# generates an inventory containing only the disposable VM, and supplies a base
# sequence: prepare, converge, verify, idempotence, side_effect, verify, idempotence.
# Default prepare waits for SSH; default side_effect reboots and verifies a new
# boot identity; the test identity needs root or passwordless sudo in the guest.
# Scenarios can override playbooks and sequence using Molecule's
# documented configuration. Do not add VM create/destroy or lint steps: the
# workflow owns lifecycle and must always call vm/destroy, including after failure.
# Set inventory-group when the deployment playbook targets a named inventory group.
# Configure Galaxy dependencies through the scenario's native dependency settings.
# The runner's Python must support the consumer's Ansible pin and Molecule.
# Native task reports and a scenario result are published even after failure;
# an empty native report set fails. Use no_log on tasks containing private values.
#
# ### Run tests
#
# Check out the consumer on a fresh Linux GitHub-hosted runner. Supply its existing
# requirements file containing an exact `ansible-core==X.Y.Z` pin and either an
# explicit `test-playbook` or one `collection`. Use a matrix for multiple targets.
# Linting and playbook syntax checks belong in separate consumer jobs.
#
# Test playbooks are executed by
# [dawidd6/action-ansible-playbook](https://github.com/dawidd6/action-ansible-playbook).
# The pinned Ansible Core is installed in a temporary virtual environment using
# the runner's Python; that Python must be supported by the selected Ansible Core.
# Ansible's built-in JUnit callback writes task results, including failed assertions.
# Provide test assertions and disposable targets, never a deployment playbook.
# `inventory`, `ansible-config`, `collections-path` and `galaxy-requirements`
# configure test execution. The action does not provision test environments.
#
# Collection sanity uses the maintained Ansible community
# [ansible-test action](https://github.com/ansible-community/ansible-test-gh-action),
# which owns Python setup, test containers and native JUnit generation.
# Its Ansible Core Git tag comes from the same requirements pin. Coverage is
# disabled for sanity checks. The selected upstream revision pins nested actions
# to full commit SHAs. Source stays in the consumer's checked-out collection.
# Sanity covers all supported Python versions unless `target-python-version`
# selects the consumer's supported runtime. These are sanity results, not code coverage.
#
# Paths must stay inside the checkout and use letters, digits, dots, underscores,
# hyphens and slashes. Each collection needs `galaxy.yml`. Use a fresh checkout per
# collection job so native `tests/output/junit` contains only that run's reports.
#
# ### Publish results
#
# Hoverkraft's `parse-ci-reports` publishes native JUnit as summaries, annotations
# and a stable PR comment. Test output and task results appear in these reports;
# use synthetic data suitable for the repository's visibility. The collection
# action also publishes its own summary.
#
# Report collection runs after upstream failures, including when the upstream
# action does not export its report output. Reports are uploaded with a unique
# artifact name and seven-day retention, including after parsing or commenting
# errors. Missing reports fail the action. Failed tests remain failures. No custom
# test runner or Docker lifecycle is maintained here. Molecule mode adds a small
# status report so idempotence and timeout failures remain visible in summaries.
#
# Grant `pull-requests: write` for comments. Fork and Dependabot comments are skipped.
# Never run untrusted tests through `pull_request_target`. Use distinct report names
# for matrix entries.
---
name: Ansible - Test
description: Run Ansible test playbooks and collection sanity with native reports, PR comments and artifacts.
author: Hoverkraft
branding:
  icon: check-circle
  color: purple
inputs:
  molecule-scenario:
    description: Checkout-relative Ansible-native scenario directory containing molecule.yml, converge.yml and verify.yml. Exclusive with test-playbook and collection.
    default: ""
  vm:
    description: Private runtime returned by vm/create in this job. Required for molecule-scenario; its generated inventory targets only this VM.
    default: ""
  inventory-group:
    description: Inventory group assigned to the disposable VM in Molecule mode.
    default: vm
  test-timeout-minutes:
    description: Molecule scenario deadline including reapplication and reboot, from 1 to 40 minutes.
    default: "20"
  ansible-requirements:
    description: Checkout-relative requirements file containing exactly one stable ansible-core==X.Y.Z pin.
    required: true
  test-playbook:
    description: Checkout-relative playbook containing test assertions. This playbook is executed. Supply test-playbook or collection, exclusively.
    default: ""
  collection:
    description: One checked-out collection directory containing galaxy.yml. Use a matrix for multiple collections.
    default: ""
  target-python-version:
    description: Optional Python major.minor for collection sanity checks. Empty tests all versions supported by Ansible Core.
    default: ""
  inventory:
    description: Optional checkout-relative inventory file for test playbook execution.
    default: ""
  ansible-config:
    description: Optional checkout-relative ansible.cfg file for test playbook execution.
    default: ""
  collections-path:
    description: Optional checkout-relative first-party collection search directory containing ansible_collections.
    default: ""
  galaxy-requirements:
    description: Optional checkout-relative Galaxy requirements file for third-party role and collection dependencies.
    default: ""
  report-name:
    description: Stable summary and PR comment title, distinct for each test step or matrix entry.
    default: Ansible test results
  github-token:
    description: Token for PR comments; requires pull-requests write. Fork and Dependabot comments are skipped.
    default: ${{ github.token }}
outputs:
  report-files:
    description: Newline-separated absolute paths of completed native reports, including after check failure.
    value: ${{ steps.collect.outputs.report-files }}
  summary:
    description: Parsed validation summary.
    value: ${{ steps.parse.outputs.summary }}
  markdown:
    description: Markdown used for the PR comment.
    value: ${{ steps.parse.outputs.markdown }}
  parsed-files:
    description: JSON array of parsed report paths.
    value: ${{ steps.parse.outputs.parsed-files }}
  artifact-id:
    description: Uploaded report artifact identifier.
    value: ${{ steps.upload.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Prepare Ansible inputs
      id: inputs
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ANSIBLE_ACTION_PATH: ${{ github.action_path }}
        ANSIBLE_PHASE: prepare
        ANSIBLE_REQUIREMENTS: ${{ inputs.ansible-requirements }}
        ANSIBLE_TEST_PLAYBOOK: ${{ inputs.test-playbook }}
        ANSIBLE_COLLECTION: ${{ inputs.collection }}
        ANSIBLE_TARGET_PYTHON_VERSION: ${{ inputs.target-python-version }}
        ANSIBLE_INVENTORY_FILE: ${{ inputs.inventory }}
        ANSIBLE_CONFIG_FILE: ${{ inputs.ansible-config }}
        ANSIBLE_COLLECTIONS_DIRECTORY: ${{ inputs.collections-path }}
        ANSIBLE_GALAXY_REQUIREMENTS: ${{ inputs.galaxy-requirements }}
        MOLECULE_SCENARIO: ${{ inputs.molecule-scenario }}
        ANSIBLE_VM: ${{ inputs.vm }}
        MOLECULE_INVENTORY_GROUP: ${{ inputs.inventory-group }}
        ANSIBLE_TEST_TIMEOUT_MINUTES: ${{ inputs.test-timeout-minutes }}
      with:
        script: require(`${process.env.ANSIBLE_ACTION_PATH}/index.cjs`)({ core });

    - name: Install the pinned Ansible test runtime
      if: steps.inputs.outputs.mode == 'playbook' || steps.inputs.outputs.mode == 'molecule'
      shell: bash
      env:
        REPORT_DIRECTORY: ${{ steps.inputs.outputs.report-directory }}
        REQUIREMENTS: ${{ steps.inputs.outputs.constraint }}
        TEST_MODE: ${{ steps.inputs.outputs.mode }}
        ANSIBLE_ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 -m venv "$REPORT_DIRECTORY/venv"
        "$REPORT_DIRECTORY/venv/bin/pip" install --disable-pip-version-check -r "$REQUIREMENTS"
        if [ "$TEST_MODE" = molecule ]; then
          "$REPORT_DIRECTORY/venv/bin/pip" install --disable-pip-version-check -c "$REQUIREMENTS" -r "$ANSIBLE_ACTION_PATH/requirements.txt"
        fi

    - name: Test deployment, idempotence and reboot with Molecule
      if: steps.inputs.outputs.mode == 'molecule'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ANSIBLE_ACTION_PATH: ${{ github.action_path }}
        ANSIBLE_PHASE: molecule
        ANSIBLE_REPORT_DIRECTORY: ${{ steps.inputs.outputs.report-directory }}
        MOLECULE_SCENARIO: ${{ steps.inputs.outputs.scenario }}
        ANSIBLE_TEST_TIMEOUT_MINUTES: ${{ inputs.test-timeout-minutes }}
        ANSIBLE_CONFIG: ${{ steps.inputs.outputs.config }}
        ANSIBLE_COLLECTIONS_PATH: ${{ steps.inputs.outputs.collections-path }}
      with:
        script: require(`${process.env.ANSIBLE_ACTION_PATH}/index.cjs`)({ core });

    - name: Execute Ansible test playbook
      if: steps.inputs.outputs.mode == 'playbook'
      uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
      env:
        ANSIBLE_CONFIG: ${{ steps.inputs.outputs.config }}
        ANSIBLE_INVENTORY: ${{ steps.inputs.outputs.inventory }}
        ANSIBLE_COLLECTIONS_PATH: ${{ steps.inputs.outputs.collections-path }}
        ANSIBLE_CALLBACKS_ENABLED: ansible.builtin.junit
        JUNIT_OUTPUT_DIR: ${{ steps.inputs.outputs.report-directory }}
        JUNIT_TASK_RELATIVE_PATH: ${{ github.workspace }}
        JUNIT_HIDE_TASK_ARGUMENTS: "true"
      with:
        playbook: ${{ steps.inputs.outputs.test-playbook }}
        requirements: ${{ steps.inputs.outputs.galaxy }}

    - name: Validate collection sanity with ansible-test
      id: sanity
      if: steps.inputs.outputs.mode == 'sanity'
      uses: ansible-community/ansible-test-gh-action@dc5c5bfa02fa4b6633e6175e65e9f8f53088180a # unstable/v1
      with:
        testing-type: sanity
        ansible-core-version: ${{ steps.inputs.outputs.ansible-core-ref }}
        collection-src-directory: ${{ github.workspace }}
        collection-root: ${{ steps.inputs.outputs.collection-root }}
        target-python-version: ${{ steps.inputs.outputs.target-python-version }}
        test-deps: ${{ steps.inputs.outputs.galaxy != '' && format('-r {0}', steps.inputs.outputs.galaxy) || '' }}
        coverage: never

    - name: Collect native Ansible reports
      id: collect
      if: ${{ always() && steps.inputs.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ANSIBLE_ACTION_PATH: ${{ github.action_path }}
        ANSIBLE_PHASE: collect
        ANSIBLE_REPORT_DIRECTORY: ${{ steps.inputs.outputs.report-directory }}
        ANSIBLE_COLLECTION_ROOT: ${{ steps.sanity.outputs.checkout-directory || steps.inputs.outputs.collection }}
      with:
        script: require(`${process.env.ANSIBLE_ACTION_PATH}/index.cjs`)({ core });

    - name: Parse Ansible reports
      if: ${{ always() && steps.collect.outputs.report-files != '' }}
      id: parse
      uses: hoverkraft-tech/ci-github-common/actions/parse-ci-reports@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
      with:
        report-name: ${{ inputs.report-name }}
        report-paths: ${{ steps.collect.outputs.report-files }}
        path-mapping: ${{ github.workspace }}:.
        output-format: summary,markdown,annotations

    - name: Add Ansible PR comment
      if: >-
        ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && steps.parse.outputs.markdown != '' }}
      uses: hoverkraft-tech/ci-github-common/actions/create-or-update-comment@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
      with:
        title: ${{ inputs.report-name }}
        body: ${{ steps.parse.outputs.markdown }}
        token: ${{ inputs.github-token }}

    - name: Upload Ansible reports
      if: ${{ always() && steps.collect.outputs.report-files != '' }}
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.inputs.outputs.id }}
        path: ${{ steps.collect.outputs.report-files }}
        if-no-files-found: error
        retention-days: 7
