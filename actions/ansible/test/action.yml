# Validate Ansible by composing maintained upstream actions and Hoverkraft reporting.
#
# ### Run checks
#
# Check out the consumer on a fresh Linux GitHub-hosted runner. Provide the existing
# requirements file containing an exact `ansible-core==X.Y.Z` pin and either
# newline-separated playbook files or one collection directory. Use a workflow
# matrix for multiple collections. No consumer Make target or tooling image is needed.
#
# Playbook validation uses [Ansible Lint](https://github.com/ansible/ansible-lint)
# with its `min` profile: content loading, parsing and native syntax checks. It
# produces SARIF directly. A uv constraint keeps Ansible Core at the consumer's
# pinned version. `galaxy-requirements` installs the consumer's role/collection
# dependencies; `collections-path` adds first-party collections to the search path.
#
# Collection validation uses the maintained Ansible community
# [ansible-test action](https://github.com/ansible-community/ansible-test-gh-action).
# It owns Python setup, the test container and native sanity/JUnit generation.
# The selected upstream revision pins its nested actions to full commit SHAs,
# matching consumers that enforce transitive action pinning.
# Its Ansible Core Git tag is derived from the same requirements pin. Coverage is
# disabled for sanity checks. Source stays in the consumer's checked-out collection.
# The upstream actions select their supported Python runtime; these checks do not
# reuse the consumer's deployment image or apply playbooks. Keep integration and
# deployment scenarios in the consumer.
#
# Paths must stay inside the checkout and use letters, digits, dots, underscores,
# hyphens and slashes. Explicit files are required; expand playbook globs in the
# workflow if needed. Each collection needs `galaxy.yml`. Use a fresh checkout per
# collection job so native `tests/output/junit` contains only that run's reports.
#
# ### Publish results
#
# Native SARIF and JUnit files are parsed with Hoverkraft's `parse-ci-reports`,
# published as summaries and annotations, and attached to a stable PR comment.
# Native reports preserve upstream diagnostics; use synthetic data suitable for
# the repository's visibility. The collection action also publishes its own summary.
#
# Report collection runs after upstream failures, including when the upstream
# action does not export its report output. Available files are copied to a fresh
# directory under `runner.temp` and uploaded with a unique artifact name and
# seven-day retention, including after parsing or commenting errors. Missing
# reports fail the action. Failed checks remain failures. No custom test runner,
# Docker lifecycle or JUnit/SARIF generator is maintained here.
#
# Grant `pull-requests: write` for comments. Fork and Dependabot comments are skipped.
# Never run untrusted checks through `pull_request_target`. Use distinct report
# names for matrix entries. Syntax and sanity results are not code coverage.
---
name: Ansible - Test
description: Compose official Ansible syntax and sanity actions with Hoverkraft reports, PR comments and artifacts.
author: Hoverkraft
branding:
  icon: check-circle
  color: purple
inputs:
  ansible-requirements:
    description: Checkout-relative requirements file containing exactly one stable ansible-core==X.Y.Z pin.
    required: true
  playbooks:
    description: Newline-separated playbook files relative to the checkout. Supply playbooks or collection, exclusively.
    default: ""
  collection:
    description: One checked-out collection directory containing galaxy.yml. Use a matrix for multiple collections.
    default: ""
  inventory:
    description: Optional checkout-relative inventory file for syntax validation.
    default: ""
  ansible-config:
    description: Optional checkout-relative ansible.cfg file for syntax validation.
    default: ""
  collections-path:
    description: Optional checkout-relative first-party collection search directory containing ansible_collections.
    default: ""
  galaxy-requirements:
    description: Optional checkout-relative Galaxy requirements file for third-party role and collection dependencies.
    default: ""
  report-name:
    description: Stable summary and PR comment title, distinct for each test step or matrix entry.
    default: Ansible test results
  github-token:
    description: Token for PR comments; requires pull-requests write. Fork and Dependabot comments are skipped.
    default: ${{ github.token }}
outputs:
  report-files:
    description: Newline-separated absolute paths of completed native reports, including after check failure.
    value: ${{ steps.collect.outputs.report-files }}
  summary:
    description: Parsed validation summary.
    value: ${{ steps.parse.outputs.summary }}
  markdown:
    description: Markdown used for the PR comment.
    value: ${{ steps.parse.outputs.markdown }}
  parsed-files:
    description: JSON array of parsed report paths.
    value: ${{ steps.parse.outputs.parsed-files }}
  artifact-id:
    description: Uploaded report artifact identifier.
    value: ${{ steps.upload.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Prepare Ansible inputs
      id: inputs
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ANSIBLE_ACTION_PATH: ${{ github.action_path }}
        ANSIBLE_PHASE: prepare
        ANSIBLE_REQUIREMENTS: ${{ inputs.ansible-requirements }}
        ANSIBLE_PLAYBOOKS: ${{ inputs.playbooks }}
        ANSIBLE_COLLECTION: ${{ inputs.collection }}
        ANSIBLE_INVENTORY_FILE: ${{ inputs.inventory }}
        ANSIBLE_CONFIG_FILE: ${{ inputs.ansible-config }}
        ANSIBLE_COLLECTIONS_DIRECTORY: ${{ inputs.collections-path }}
        ANSIBLE_GALAXY_REQUIREMENTS: ${{ inputs.galaxy-requirements }}
      with:
        script: require(`${process.env.ANSIBLE_ACTION_PATH}/index.cjs`)({ core });

    - name: Validate playbook syntax with Ansible Lint
      if: steps.inputs.outputs.mode == 'syntax'
      uses: ansible/ansible-lint@9bce2bfb8f4a984e6b13767bc0d6bf0a49492164 # v26.10.1
      env:
        UV_CONSTRAINT: ${{ steps.inputs.outputs.constraint }}
        ANSIBLE_CONFIG: ${{ steps.inputs.outputs.config }}
        ANSIBLE_INVENTORY: ${{ steps.inputs.outputs.inventory }}
        ANSIBLE_COLLECTIONS_PATH: ${{ steps.inputs.outputs.collections-path }}
      with:
        # Required by upstream when nested in a composite action.
        override_version: ${{ steps.inputs.outputs.ansible-lint-ref }}
        args: ${{ steps.inputs.outputs.lint-args }}
        requirements_file: ${{ steps.inputs.outputs.galaxy }}

    - name: Validate collection sanity with ansible-test
      id: sanity
      if: steps.inputs.outputs.mode == 'sanity'
      uses: ansible-community/ansible-test-gh-action@dc5c5bfa02fa4b6633e6175e65e9f8f53088180a # unstable/v1
      with:
        testing-type: sanity
        ansible-core-version: ${{ steps.inputs.outputs.ansible-core-ref }}
        collection-src-directory: ${{ github.workspace }}
        collection-root: ${{ steps.inputs.outputs.collection-root }}
        test-deps: ${{ steps.inputs.outputs.galaxy != '' && format('-r {0}', steps.inputs.outputs.galaxy) || '' }}
        coverage: never

    - name: Collect native Ansible reports
      id: collect
      if: ${{ always() && steps.inputs.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ANSIBLE_ACTION_PATH: ${{ github.action_path }}
        ANSIBLE_PHASE: collect
        ANSIBLE_REPORT_DIRECTORY: ${{ steps.inputs.outputs.report-directory }}
        ANSIBLE_COLLECTION_ROOT: ${{ steps.sanity.outputs.checkout-directory || steps.inputs.outputs.collection }}
      with:
        script: require(`${process.env.ANSIBLE_ACTION_PATH}/index.cjs`)({ core });

    - name: Parse Ansible reports
      if: ${{ always() && steps.collect.outputs.report-files != '' }}
      id: parse
      uses: hoverkraft-tech/ci-github-common/actions/parse-ci-reports@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
      with:
        report-name: ${{ inputs.report-name }}
        report-paths: ${{ steps.collect.outputs.report-files }}
        path-mapping: ${{ github.workspace }}:.
        output-format: summary,markdown,annotations

    - name: Add Ansible PR comment
      if: >-
        ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && steps.parse.outputs.markdown != '' }}
      uses: hoverkraft-tech/ci-github-common/actions/create-or-update-comment@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
      with:
        title: ${{ inputs.report-name }}
        body: ${{ steps.parse.outputs.markdown }}
        token: ${{ inputs.github-token }}

    - name: Upload Ansible reports
      if: ${{ always() && steps.collect.outputs.report-files != '' }}
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.inputs.outputs.id }}
        path: ${{ steps.collect.outputs.report-files }}
        if-no-files-found: error
        retention-days: 7
