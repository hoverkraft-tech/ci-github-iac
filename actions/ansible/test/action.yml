# Validate Ansible playbooks and first-party collections in a consumer tooling image.
#
# ### Run checks
#
# Check out the consumer and build or pull its tooling image before this action.
# The Linux runner needs Docker. The image must provide `/bin/sh`, `ansible-playbook`,
# `ansible-test` and `python3`, with the consumer's pinned dependencies installed.
# No Makefile or reporting script is required. The image's entrypoint is replaced.
#
# Supply newline-separated `playbooks`, `collections`, or both. Paths are explicit
# checkout-relative paths, without globs. Inventory is optional; when omitted,
# Ansible uses the image's configuration. Missing, empty and escaping paths fail.
# Collection roots must follow `ansible_collections/namespace/name` layout.
#
# Each playbook runs with `ansible-playbook --syntax-check`. Each collection runs
# with `ansible-test sanity --python` using the image's Python version. Checks
# continue after a nonzero exit so all selected targets receive a result. Each
# command has a 20-minute timeout. Interrupted containers are forcibly removed.
# These checks do not apply playbooks or measure code coverage; integration and
# deployment scenarios remain in the consumer.
#
# The checkout is mounted at `/workspace` and commands start there (sanity starts
# in its collection directory). Containers run with the runner's UID/GID and a
# temporary home. Use `environment` for Ansible configuration, for example
# `ANSIBLE_COLLECTIONS_PATH=/opt/ansible/collections:/workspace/ansible/collections`.
# Image environment defaults remain available. Runner secrets are not forwarded.
#
# `cache-directory` optionally mounts a checkout-local directory for ansible-test
# virtual environments. Restore/save it with `actions/cache`, keyed by the tooling
# runtime. The action does not cache source files or reports. Sanity's normal
# `tests/output/` files remain in each collection and are not uploaded.
#
# ### Publish results
#
# The action writes fresh JUnit status results for every executed check and SARIF
# locations for syntax failures under `runner.temp`. Raw command output remains
# in execution logs; report artifacts contain status and file locations only.
# Hoverkraft's parser publishes summaries and annotations. PR comments use a
# stable `report-name` and require `pull-requests: write`; forks and Dependabot
# skip comments. Never use `pull_request_target` to execute untrusted tests.
#
# Completed reports are uploaded with unique artifact names and seven-day
# retention, including after checks or report publication fail. Neither a parser
# nor an upload can turn failed checks into success. Use a distinct report name
# for each invocation. Reports describe validation results, not code coverage.
---
name: Ansible - Test
description: Validate playbook syntax and collection sanity, publish reports and annotate pull requests.
author: Hoverkraft
branding:
  icon: check-circle
  color: purple
inputs:
  container-image:
    description: Built or pulled tooling image containing Ansible and the consumer's dependencies.
    required: true
  playbooks:
    description: Newline-separated nonempty playbook files relative to the checkout. Supply playbooks or collections.
    default: ""
  inventory:
    description: Optional inventory file relative to the checkout for syntax validation.
    default: ""
  collections:
    description: Newline-separated first-party collection directories relative to the checkout for sanity validation.
    default: ""
  environment:
    description: Newline-separated ANSIBLE_* assignments using container paths. ANSIBLE_HOME and ANSIBLE_NOCOLOR are managed by the action.
    default: ""
  cache-directory:
    description: Optional checkout-relative directory for ansible-test virtual environments; manage persistence with actions/cache.
    default: ""
  report-name:
    description: Stable summary and PR comment title, distinct for each test step.
    default: Ansible test results
  github-token:
    description: Token for PR comments; requires pull-requests write. Fork and Dependabot comments are skipped.
    default: ${{ github.token }}
outputs:
  report-files:
    description: Newline-separated absolute paths of completed JUnit and SARIF reports, also after check failure.
    value: ${{ steps.test.outputs.report-files }}
  summary:
    description: Parsed validation summary.
    value: ${{ steps.parse.outputs.summary }}
  markdown:
    description: Markdown used for the PR comment.
    value: ${{ steps.parse.outputs.markdown }}
  parsed-files:
    description: JSON array of parsed report paths.
    value: ${{ steps.parse.outputs.parsed-files }}
  artifact-id:
    description: Uploaded report artifact identifier.
    value: ${{ steps.upload.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Run Ansible checks
      id: test
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ANSIBLE_ACTION_PATH: ${{ github.action_path }}
        ANSIBLE_TEST_IMAGE: ${{ inputs.container-image }}
        ANSIBLE_TEST_PLAYBOOKS: ${{ inputs.playbooks }}
        ANSIBLE_TEST_INVENTORY: ${{ inputs.inventory }}
        ANSIBLE_TEST_COLLECTIONS: ${{ inputs.collections }}
        ANSIBLE_TEST_ENVIRONMENT: ${{ inputs.environment }}
        ANSIBLE_TEST_CACHE: ${{ inputs.cache-directory }}
      with:
        script: await require(`${process.env.ANSIBLE_ACTION_PATH}/index.cjs`)({ core });

    - name: Parse Ansible reports
      if: ${{ always() && steps.test.outputs.report-files != '' }}
      id: parse
      uses: hoverkraft-tech/ci-github-common/actions/parse-ci-reports@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
      with:
        report-name: ${{ inputs.report-name }}
        report-paths: ${{ steps.test.outputs.report-files }}
        output-format: summary,markdown,annotations

    - name: Add Ansible PR comment
      if: >-
        ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && steps.parse.outputs.markdown != '' }}
      uses: hoverkraft-tech/ci-github-common/actions/create-or-update-comment@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
      with:
        title: ${{ inputs.report-name }}
        body: ${{ steps.parse.outputs.markdown }}
        token: ${{ inputs.github-token }}

    - name: Upload Ansible reports
      if: ${{ always() && steps.test.outputs.report-files != '' }}
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.test.outputs.id }}
        path: ${{ steps.test.outputs.report-files }}
        if-no-files-found: error
        retention-days: 7
