# Validate a disposable Linux VM with Goss and publish JUnit results.
#
# Pass the `vm` output from [vm/create](../create/README.md) in the same job and
# a required checkout-relative `goss-file`. The action works with both creation
# backends. Always schedule [vm/destroy](../destroy/README.md), including after
# assertion or report publication failure. Testing leaves the VM running.
#
# ### Write a suite
#
# Use Goss resources for files, packages, services, users and commands. Keep
# deployment, idempotence and reboot in Ansible Molecule scenarios. Complex checks
# can invoke consumer-owned probes already installed in the guest; checkout files
# other than the rendered suite are not copied automatically.
#
# The action downloads and verifies the pinned Goss release, renders the suite,
# includes and optional `goss-vars` on the runner, then copies the binary and
# rendered suite to the guest. Templates therefore use runner environment values;
# pass guest-specific expectations through `goss-vars`. Goss runs as the SSH user
# through a fresh login so group changes made during provisioning take effect.
# Both runner and guest must be Linux x86-64. The guest needs Bash, uname, chmod,
# GNU find and an SSH file-copy service. Consumers need no Goss installation.
#
# Setup and execution share `test-timeout-minutes` (1 to 40, default 10).
# Collection has a separate two-minute limit and accepts only the native Goss
# report, a nonempty regular file up to 20 MiB. Missing, empty and fully skipped
# suites fail. Reports are collected after failed assertions; private guest test
# files are then removed. Incomplete transfers are never published.
#
# ### Publish results
#
# Each invocation publishes native JUnit plus a sanitized execution-status report
# through Hoverkraft's report parser: job summary, annotations and, on eligible
# pull requests, an updated comment. Use a distinct stable `report-name` for each
# step and matrix scenario. Comments use `github.token` and require
# `pull-requests: write`; forks and Dependabot still receive summaries and artifacts.
# Do not use `pull_request_target` to execute untrusted suites.
#
# Completed reports are retained as a unique GitHub artifact for seven days, even
# after parser or comment failure. Raw command output and exceptions are excluded
# from the execution-status report. Native Goss reports retain assertion details:
# use synthetic expectations and never match or print credentials. Infrastructure
# assertions produce test results, not application code coverage.
#
# See the [lifecycle example](../create/README.md#compose-the-vm-actions).
# For consolidated comments, set `comment: false` and call the common `ci-reports`
# workflow after all test jobs. Native report artifacts use the `ci-reports-` prefix
# and the current run attempt, so earlier attempts cannot leak stale results.
---
name: VM - Test
description: Validate VM state with Goss, publish summaries and PR comments, and upload JUnit results.
author: Hoverkraft
branding:
  icon: check-circle
  color: purple
inputs:
  vm:
    description: VM reference returned by vm/create in the same job; works with either backend.
    required: true
  goss-file:
    description: Required checkout-relative Goss suite, including any referenced Goss files.
    required: true
  goss-vars:
    description: Optional checkout-relative JSON or YAML variables file. Use values suitable for public reports.
    default: ""
  test-timeout-minutes:
    description: Combined Goss setup and execution timeout, from 1 to 40 minutes.
    default: "10"
  report-name:
    description: Summary and PR comment title. Use a distinct stable name for each test step and matrix scenario.
    default: VM test results
  comment:
    description: Publish an individual PR comment. Set false when using the shared ci-reports workflow; summaries, annotations and artifacts remain enabled.
    default: "true"
runs:
  using: composite
  steps:
    - name: Run Goss assertions
      id: test
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        VM_DIRECTORY: ${{ inputs.vm }}
        GOSS_FILE: ${{ inputs.goss-file }}
        GOSS_VARS: ${{ inputs.goss-vars }}
        TEST_TIMEOUT_MINUTES: ${{ inputs.test-timeout-minutes }}
      with:
        script: |
          const { Guest } = require(`${process.env.ACTION_PATH}/guest.cjs`);
          const { GuestAssertions } = require(`${process.env.ACTION_PATH}/assertions.cjs`);
          try {
            const assertions = new GuestAssertions(
              { goss: process.env.GOSS_FILE, variables: process.env.GOSS_VARS },
              process.env.RUNNER_TEMP,
              process.env.TEST_TIMEOUT_MINUTES,
            );
            try {
              await assertions.run(new Guest(process.env.VM_DIRECTORY, { exec }), { exec, io });
            } finally {
              if (assertions.report || assertions.reportFiles?.length)
                core.setOutput("id", assertions.id);
              if (assertions.report) core.setOutput("report", assertions.report);
              if (assertions.reportFiles?.length)
                core.setOutput("report-files", assertions.reportFiles.join("\n"));
            }
          } catch {
            core.setFailed("Goss assertions or report collection failed. Inspect the available reports.");
          }

    - name: Parse test reports
      if: ${{ always() && (steps.test.outputs.report-files != '' || steps.test.outputs.report != '') }}
      id: parse-test-reports
      uses: hoverkraft-tech/ci-github-common/actions/parse-ci-reports@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
      with:
        report-name: ${{ inputs.report-name }}
        report-paths: |
          ${{ steps.test.outputs.report }}
          ${{ steps.test.outputs.report-files }}
        output-format: summary,markdown,annotations

    - name: Add test PR comment
      if: >-
        ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && steps.parse-test-reports.outputs.markdown != '' }}
      uses: hoverkraft-tech/ci-github-common/actions/create-or-update-comment@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
      with:
        title: ${{ inputs.report-name }}
        body: ${{ steps.parse-test-reports.outputs.markdown }}
        token: ${{ github.token }}

    - name: Upload test reports
      if: ${{ always() && (steps.test.outputs.report-files != '' || steps.test.outputs.report != '') }}
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-reports-${{ github.run_attempt }}-${{ github.job }}-${{ steps.test.outputs.id }}
        path: |
          ${{ steps.test.outputs.report }}
          ${{ steps.test.outputs.report-files }}
        if-no-files-found: error
        retention-days: 7
