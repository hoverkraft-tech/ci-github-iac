# Execute assertions, collect selected guest reports and write command-status JUnit.
# See [the usage guide](../../../docs/usage/vm-e2e.md) for workflow composition.
---
name: VM - Test
description: Run guest assertions and collect test reports for Hoverkraft CI reporting.
author: Hoverkraft
branding:
  icon: check-circle
  color: purple
inputs:
  vm:
    description: Private runtime directory returned by vm/create.
    required: true
  test-script:
    description: Nonempty Bash script in the checkout to execute inside the guest.
    required: true
  test-timeout-minutes:
    description: Guest script timeout, from 1 to 40 minutes.
    default: "10"
  report-file:
    description: |
      Optional report paths or glob patterns relative to the guest REPORTS_DIR.
      Separate patterns with newlines, commas or semicolons. Every pattern must match.
      The script receives a fresh REPORTS_DIR; matched files are collected even after test failure.
      Report contents are preserved. Use only reports suitable for public CI.
    default: ""
outputs:
  report:
    description: Absolute path of the sanitized command-status JUnit report, including on assertion or collection failure.
    value: ${{ steps.test.outputs.report }}
  report-files:
    description: Newline-separated absolute paths of completed guest report files. Empty when collection is disabled or fails.
    value: ${{ steps.test.outputs.report-files }}
runs:
  using: composite
  steps:
    - name: Execute guest assertions
      id: test
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        VM_ACTION_PATH: ${{ github.action_path }}
        VM_DIRECTORY: ${{ inputs.vm }}
        TEST_SCRIPT: ${{ inputs.test-script }}
        TEST_TIMEOUT_MINUTES: ${{ inputs.test-timeout-minutes }}
        REPORT_FILE: ${{ inputs.report-file }}
      with:
        script: require(`${process.env.VM_ACTION_PATH}/index.cjs`)({ core });
