# Create a disposable Lima guest and return its private runtime directory.
# See [the usage guide](../../../docs/usage/vm-e2e.md) for workflow composition.
---
name: VM - Create
description: Create an isolated Lima VM, rolling back resources if startup fails.
author: Hoverkraft
branding:
  icon: server
  color: purple
inputs:
  vm-config:
    description: Optional Lima YAML file in the checkout; defaults to pinned Ubuntu. Plain mode is enforced.
    default: ""
outputs:
  vm:
    description: Private Lima runtime directory for subsequent VM actions; allocated before startup.
    value: ${{ steps.create.outputs.vm }}
  id:
    description: Unique identifier for this invocation.
    value: ${{ steps.create.outputs.id }}
runs:
  using: composite
  steps:
    - name: Set up Lima and QEMU
      uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
      with:
        # renovate: datasource=github-releases depName=lima-vm/lima
        version: v2.2.1
    - name: Create VM
      id: create
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        VM_ACTION_PATH: ${{ github.action_path }}
        VM_CONFIG: ${{ inputs.vm-config }}
      with:
        script: |
          const { VirtualMachine } = require(`${process.env.VM_ACTION_PATH}/../runtime.cjs`);
          try {
            const template = VirtualMachine.template(process.env.VM_CONFIG);
            const vm = VirtualMachine.allocate();
            core.info(`VM recovery directory: ${vm.home}`);
            core.setOutput('vm', vm.home);
            core.setOutput('id', require('node:path').basename(vm.home));
            vm.create(template);
          } catch {
            core.setFailed('VM creation failed. Retry cleanup using the runtime directory if allocated.');
          }
